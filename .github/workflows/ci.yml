name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (tiers 0-2, API v2)
        run: cargo clippy --workspace --all-targets

      - name: Lint (all tiers, API v6)
        run: cargo clippy -p qemu-pgo-plugin --features tier3 --all-targets

      - name: Build plugin (tiers 0-2, API v2)
        run: cargo build --release -p qemu-pgo-plugin

      - name: Build plugin (all tiers, API v6)
        run: cargo build --release -p qemu-pgo-plugin --features tier3

      - name: Build converter
        run: cargo build --release -p tcg-prof-convert

      - name: Run unit and integration tests
        run: cargo test --workspace --release
